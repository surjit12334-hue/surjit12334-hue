<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Surjit - Retro Programmer</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap');

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: #0a0a0a;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    overflow: hidden;
    font-family: 'Press Start 2P', monospace;
  }

  .crt {
    position: relative;
    width: 700px;
    height: 500px;
    background: #0d1117;
    border: 4px solid #333;
    border-radius: 20px;
    box-shadow: 0 0 40px rgba(0,255,100,0.15), inset 0 0 60px rgba(0,0,0,0.5);
    overflow: hidden;
  }

  .crt::before {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0; bottom: 0;
    background: repeating-linear-gradient(
      0deg,
      rgba(0,0,0,0.15) 0px,
      rgba(0,0,0,0.15) 1px,
      transparent 1px,
      transparent 3px
    );
    pointer-events: none;
    z-index: 10;
  }

  .crt::after {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0; bottom: 0;
    background: radial-gradient(ellipse at center, transparent 50%, rgba(0,0,0,0.4) 100%);
    pointer-events: none;
    z-index: 11;
  }

  .scene {
    position: relative;
    width: 100%;
    height: 100%;
  }

  /* Stars background */
  .stars {
    position: absolute;
    width: 100%;
    height: 40%;
    top: 0;
  }
  .star {
    position: absolute;
    width: 2px;
    height: 2px;
    background: #fff;
    animation: twinkle 1.5s infinite alternate;
  }

  @keyframes twinkle {
    0% { opacity: 0.2; }
    100% { opacity: 1; }
  }

  /* Floor */
  .floor {
    position: absolute;
    bottom: 0;
    width: 100%;
    height: 100px;
    background: #1a1a2e;
    border-top: 3px solid #16213e;
  }
  .floor::before {
    content: '';
    position: absolute;
    top: 0;
    width: 100%;
    height: 100%;
    background: repeating-linear-gradient(
      90deg,
      transparent,
      transparent 38px,
      #16213e 38px,
      #16213e 40px
    );
  }

  /* Desk */
  .desk {
    position: absolute;
    bottom: 95px;
    left: 50%;
    transform: translateX(-50%);
    width: 300px;
    height: 15px;
    background: #5c4033;
    border-bottom: 4px solid #3d2b1f;
    border-radius: 2px;
  }
  .desk-leg-l {
    position: absolute;
    bottom: 40px;
    left: 50%;
    transform: translateX(-50%);
    margin-left: -120px;
    width: 8px;
    height: 55px;
    background: #5c4033;
  }
  .desk-leg-r {
    position: absolute;
    bottom: 40px;
    left: 50%;
    transform: translateX(-50%);
    margin-left: 115px;
    width: 8px;
    height: 55px;
    background: #5c4033;
  }

  /* Monitor */
  .monitor {
    position: absolute;
    bottom: 110px;
    left: 50%;
    transform: translateX(-50%);
    width: 160px;
    height: 110px;
    background: #2a2a3e;
    border: 4px solid #444;
    border-radius: 8px;
    overflow: hidden;
  }
  .monitor-screen {
    position: absolute;
    top: 6px; left: 6px; right: 6px; bottom: 20px;
    background: #001a00;
    border: 2px solid #003300;
    overflow: hidden;
  }
  .monitor-stand {
    position: absolute;
    bottom: 90px;
    left: 50%;
    transform: translateX(-50%);
    width: 20px;
    height: 10px;
    background: #444;
  }

  /* Code animation on screen */
  .code-line {
    position: absolute;
    font-size: 6px;
    color: #00ff41;
    white-space: nowrap;
    animation: typeCode 4s infinite;
    opacity: 0;
  }
  .code-line:nth-child(1) { top: 5px; left: 5px; animation-delay: 0s; }
  .code-line:nth-child(2) { top: 15px; left: 5px; animation-delay: 0.5s; color: #ff6600; }
  .code-line:nth-child(3) { top: 25px; left: 5px; animation-delay: 1s; color: #00ccff; }
  .code-line:nth-child(4) { top: 35px; left: 5px; animation-delay: 1.5s; color: #ffff00; }
  .code-line:nth-child(5) { top: 45px; left: 5px; animation-delay: 2s; color: #ff00ff; }
  .code-line:nth-child(6) { top: 55px; left: 5px; animation-delay: 2.5s; color: #00ff41; }

  @keyframes typeCode {
    0% { opacity: 0; transform: translateX(-10px); }
    10% { opacity: 1; transform: translateX(0); }
    80% { opacity: 1; }
    100% { opacity: 0; }
  }

  /* Cursor blink */
  .cursor {
    position: absolute;
    width: 6px;
    height: 8px;
    background: #00ff41;
    animation: blink 0.6s infinite;
  }
  @keyframes blink {
    0%, 49% { opacity: 1; }
    50%, 100% { opacity: 0; }
  }

  /* Pixel Boy */
  .boy {
    position: absolute;
    bottom: 108px;
    left: 50%;
    transform: translateX(-50%);
    margin-left: -180px;
    image-rendering: pixelated;
  }

  /* Pixel art using box shadows */
  .pixel-boy {
    position: relative;
    width: 4px;
    height: 4px;
    background: transparent;
    box-shadow:
      /* Hair */
      12px 0 0 #3d2b1f, 16px 0 0 #3d2b1f, 20px 0 0 #3d2b1f, 24px 0 0 #3d2b1f,
      8px 4px 0 #3d2b1f, 12px 4px 0 #3d2b1f, 16px 4px 0 #3d2b1f, 20px 4px 0 #3d2b1f, 24px 4px 0 #3d2b1f, 28px 4px 0 #3d2b1f,
      8px 8px 0 #3d2b1f, 28px 8px 0 #3d2b1f,
      /* Face */
      12px 8px 0 #ffcc99, 16px 8px 0 #ffcc99, 20px 8px 0 #ffcc99, 24px 8px 0 #ffcc99,
      12px 12px 0 #ffcc99, 16px 12px 0 #ffcc99, 20px 12px 0 #ffcc99, 24px 12px 0 #ffcc99,
      /* Eyes */
      12px 12px 0 #000, 20px 12px 0 #000,
      /* Mouth */
      16px 16px 0 #cc6666,
      /* Body - Shirt */
      8px 20px 0 #0066cc, 12px 20px 0 #0066cc, 16px 20px 0 #0066cc, 20px 20px 0 #0066cc, 24px 20px 0 #0066cc, 28px 20px 0 #0066cc,
      8px 24px 0 #0066cc, 12px 24px 0 #0066cc, 16px 24px 0 #0066cc, 20px 24px 0 #0066cc, 24px 24px 0 #0066cc, 28px 24px 0 #0066cc,
      8px 28px 0 #0066cc, 12px 28px 0 #0066cc, 16px 28px 0 #0066cc, 20px 28px 0 #0066cc, 24px 28px 0 #0066cc, 28px 28px 0 #0066cc,
      /* Arms */
      4px 24px 0 #ffcc99, 32px 24px 0 #ffcc99,
      4px 28px 0 #ffcc99, 32px 28px 0 #ffcc99,
      /* Pants */
      12px 32px 0 #1a1a3e, 16px 32px 0 #1a1a3e, 20px 32px 0 #1a1a3e, 24px 32px 0 #1a1a3e,
      12px 36px 0 #1a1a3e, 16px 36px 0 #1a1a3e, 20px 36px 0 #1a1a3e, 24px 36px 0 #1a1a3e,
      /* Shoes */
      8px 40px 0 #222, 12px 40px 0 #222, 24px 40px 0 #222, 28px 40px 0 #222;
    transform: scale(3);
    transform-origin: bottom left;
    animation: typing 0.3s infinite alternate;
  }

  @keyframes typing {
    0% { transform: scale(3) translateY(0); }
    100% { transform: scale(3) translateY(-1px); }
  }

  /* Hands typing on keyboard */
  .hands {
    position: absolute;
    bottom: 112px;
    left: 50%;
    transform: translateX(-50%);
    margin-left: -180px;
    width: 40px;
    height: 8px;
  }
  .hand {
    position: absolute;
    width: 8px;
    height: 6px;
    background: #ffcc99;
    border-radius: 2px;
    animation: typingHands 0.2s infinite alternate;
  }
  .hand.left { left: 0; }
  .hand.right { right: 0; animation-delay: 0.1s; }

  @keyframes typingHands {
    0% { transform: translateY(0); }
    100% { transform: translateY(-3px); }
  }

  /* Keyboard */
  .keyboard {
    position: absolute;
    bottom: 108px;
    left: 50%;
    transform: translateX(-50%);
    margin-left: -20px;
    width: 40px;
    height: 10px;
    background: #333;
    border: 1px solid #555;
    border-radius: 2px;
  }

  /* Title text */
  .title {
    position: absolute;
    top: 20px;
    width: 100%;
    text-align: center;
    z-index: 5;
  }
  .title h1 {
    font-size: 14px;
    color: #00ff41;
    text-shadow: 0 0 10px #00ff41, 0 0 20px #00ff41;
    animation: glow 2s infinite alternate;
  }
  .title p {
    font-size: 8px;
    color: #ff6600;
    margin-top: 10px;
    animation: blink 1s infinite;
  }

  @keyframes glow {
    0% { text-shadow: 0 0 5px #00ff41; }
    100% { text-shadow: 0 0 20px #00ff41, 0 0 40px #00ff41; }
  }

  /* Floating coins */
  .coin {
    position: absolute;
    width: 12px;
    height: 12px;
    background: #ffd700;
    border: 2px solid #daa520;
    border-radius: 50%;
    animation: floatCoin 3s infinite ease-in-out;
    font-size: 6px;
    display: flex;
    align-items: center;
    justify-content: center;
    color: #8B6914;
    font-weight: bold;
  }
  .coin:nth-child(1) { top: 20%; right: 10%; animation-delay: 0s; }
  .coin:nth-child(2) { top: 30%; right: 15%; animation-delay: 0.5s; }
  .coin:nth-child(3) { top: 15%; right: 20%; animation-delay: 1s; }

  @keyframes floatCoin {
    0%, 100% { transform: translateY(0) rotate(0deg); }
    50% { transform: translateY(-20px) rotate(180deg); }
  }

  /* HP Bar */
  .hp-bar {
    position: absolute;
    top: 20px;
    left: 20px;
    z-index: 5;
  }
  .hp-label {
    font-size: 7px;
    color: #fff;
    margin-bottom: 3px;
  }
  .hp-outer {
    width: 120px;
    height: 10px;
    background: #333;
    border: 2px solid #555;
  }
  .hp-inner {
    height: 100%;
    background: linear-gradient(90deg, #ff0000, #ff4444);
    animation: hpFill 2s forwards;
    width: 0%;
  }
  @keyframes hpFill {
    100% { width: 85%; }
  }

  /* Level */
  .level {
    position: absolute;
    top: 20px;
    right: 20px;
    font-size: 8px;
    color: #ffd700;
    z-index: 5;
    animation: levelUp 2s infinite;
  }
  @keyframes levelUp {
    0%, 100% { transform: scale(1); }
    50% { transform: scale(1.1); }
  }

  /* Score */
  .score {
    position: absolute;
    top: 50px;
    left: 20px;
    font-size: 7px;
    color: #00ffff;
    z-index: 5;
  }

  /* Power-ups */
  .powerup {
    position: absolute;
    font-size: 16px;
    animation: powerFloat 4s infinite ease-in-out;
  }
  .powerup:nth-child(1) { bottom: 150px; left: 10%; animation-delay: 0s; }
  .powerup:nth-child(2) { bottom: 180px; right: 8%; animation-delay: 1s; }

  @keyframes powerFloat {
    0%, 100% { transform: translateY(0) scale(1); opacity: 0.7; }
    50% { transform: translateY(-30px) scale(1.2); opacity: 1; }
  }

  /* Speech bubble */
  .speech {
    position: absolute;
    bottom: 170px;
    left: 50%;
    transform: translateX(-50%);
    margin-left: -150px;
    background: #fff;
    color: #000;
    font-size: 6px;
    padding: 6px 10px;
    border-radius: 8px;
    z-index: 5;
    animation: speechPop 3s infinite;
  }
  .speech::after {
    content: '';
    position: absolute;
    bottom: -6px;
    left: 15px;
    width: 0;
    height: 0;
    border-left: 6px solid transparent;
    border-right: 6px solid transparent;
    border-top: 6px solid #fff;
  }
  @keyframes speechPop {
    0%, 70%, 100% { opacity: 1; transform: translateX(-50%) scale(1); }
    80% { opacity: 0; transform: translateX(-50%) scale(0.8); }
    90% { opacity: 0; transform: translateX(-50%) scale(0.8); }
  }

  /* Loading bar at bottom */
  .loading {
    position: absolute;
    bottom: 10px;
    left: 50%;
    transform: translateX(-50%);
    font-size: 6px;
    color: #888;
    z-index: 5;
  }
  .loading-bar {
    width: 200px;
    height: 6px;
    background: #222;
    border: 1px solid #444;
    margin-top: 4px;
  }
  .loading-fill {
    height: 100%;
    background: #00ff41;
    animation: loading 3s infinite;
  }
  @keyframes loading {
    0% { width: 0%; }
    100% { width: 100%; }
  }

  /* Pixel clouds */
  .cloud {
    position: absolute;
    background: rgba(255,255,255,0.1);
    border-radius: 50%;
    animation: cloudMove 20s infinite linear;
  }
  .cloud:nth-child(1) { width: 60px; height: 20px; top: 60px; left: -60px; animation-duration: 25s; }
  .cloud:nth-child(2) { width: 40px; height: 15px; top: 80px; left: -40px; animation-duration: 30s; animation-delay: 5s; }

  @keyframes cloudMove {
    0% { transform: translateX(0); }
    100% { transform: translateX(800px); }
  }

</style>
</head>
<body>

<div class="crt">
  <div class="scene">

    <!-- Stars -->
    <div class="stars" id="stars"></div>

    <!-- Clouds -->
    <div class="cloud"></div>
    <div class="cloud"></div>

    <!-- HP Bar -->
    <div class="hp-bar">
      <div class="hp-label">SKILL</div>
      <div class="hp-outer"><div class="hp-inner"></div></div>
    </div>

    <!-- Score -->
    <div class="score">CODE: 0000000</div>

    <!-- Level -->
    <div class="level">LVL 99</div>

    <!-- Title -->
    <div class="title">
      <h1>SURJEET SINGH</h1>
      <p>&gt; LEVEL UP YOUR CODE_</p>
    </div>

    <!-- Powerups -->
    <div class="powerup">⚡</div>
    <div class="powerup">🔥</div>

    <!-- Coins -->
    <div class="coin">$</div>
    <div class="coin">$</div>
    <div class="coin">$</div>

    <!-- Speech bubble -->
    <div class="speech">while(coffee) { code(); }</div>

    <!-- Pixel Boy -->
    <div class="boy">
      <div class="pixel-boy"></div>
    </div>

    <!-- Hands -->
    <div class="hands">
      <div class="hand left"></div>
      <div class="hand right"></div>
    </div>

    <!-- Keyboard -->
    <div class="keyboard"></div>

    <!-- Monitor -->
    <div class="monitor">
      <div class="monitor-screen">
        <div class="code-line">def build_future():</div>
        <div class="code-line">  return ideas</div>
        <div class="code-line">import dreams</div>
        <div class="code-line">class Surjit:</div>
        <div class="code-line">  skill = 100</div>
        <div class="code-line">print("Hello World")</div>
        <div class="cursor" style="bottom: 5px; right: 8px;"></div>
      </div>
    </div>
    <div class="monitor-stand"></div>

    <!-- Desk -->
    <div class="desk"></div>
    <div class="desk-leg-l"></div>
    <div class="desk-leg-r"></div>

    <!-- Floor -->
    <div class="floor"></div>

    <!-- Loading -->
    <div class="loading">
      LOADING AWESOMENESS...
      <div class="loading-bar"><div class="loading-fill"></div></div>
    </div>

  </div>
</div>

<script>
  // Generate stars
  const starsContainer = document.getElementById('stars');
  for (let i = 0; i < 40; i++) {
    const star = document.createElement('div');
    star.className = 'star';
    star.style.left = Math.random() * 100 + '%';
    star.style.top = Math.random() * 100 + '%';
    star.style.animationDelay = Math.random() * 2 + 's';
    star.style.width = (Math.random() > 0.7 ? 3 : 2) + 'px';
    star.style.height = star.style.width;
    starsContainer.appendChild(star);
  }

  // Score counter
  let score = 0;
  const scoreEl = document.querySelector('.score');
  setInterval(() => {
    score += Math.floor(Math.random() * 100);
    scoreEl.textContent = 'CODE: ' + String(score).padStart(7, '0');
  }, 500);

  // Random speech bubbles
  const phrases = [
    'while(coffee) { code(); }',
    'git commit -m "magic"',
    'sudo make me a sandwich',
    '404: sleep not found',
    'npm install success!',
    'Stack overflow FTW!',
    'console.log("bug")',
    'if (coffee) brew();',
  ];
  const speech = document.querySelector('.speech');
  setInterval(() => {
    speech.textContent = phrases[Math.floor(Math.random() * phrases.length)];
  }, 4000);
</script>

</body>
</html>
